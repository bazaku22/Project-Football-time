name: StrikerAPI current squad intake tests
on:
  pull_request:
    paths:
      - "scripts/strikerapi_squad_intake.py"
      - "tests/test_strikerapi_squad_intake.py"
      - "scripts/player_reconciliation_pipeline.py"
      - "tests/test_player_reconciliation_pipeline.py"
      - "scripts/strikerapi_team_reference.py"
      - "tests/test_strikerapi_team_reference.py"
      - "js/player-squad-review.js"
      - "css/player-squad-review.css"
      - "tests/test_player_squad_review_ui.py"
      - "tests/test_player_identity_review_ui.py"
      - "index.html"
      - "sw.js"
      - ".github/workflows/run-player-reconciliation.yml"
      - "docs/strikerapi-current-squad-intake-2026-27.md"
      - "docs/player-reconciliation-pipeline-2026-27.md"
      - ".github/workflows/strikerapi-squad-intake-tests.yml"
      - ".github/workflows/fetch-strikerapi-current-squads.yml"
permissions:
  contents: read
jobs:
  offline-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Compile and run offline tests
        run: |
          python -m py_compile scripts/strikerapi_squad_intake.py tests/test_strikerapi_squad_intake.py
          python -m py_compile scripts/player_reconciliation_pipeline.py tests/test_player_reconciliation_pipeline.py
          python -m py_compile scripts/strikerapi_team_reference.py tests/test_strikerapi_team_reference.py
          python -m unittest tests/test_strikerapi_squad_intake.py -v
          python -m unittest tests/test_player_reconciliation_pipeline.py -v
          python -m unittest tests/test_strikerapi_team_reference.py -v
          python -m unittest tests/test_player_squad_review_ui.py -v
          python -m unittest tests/test_player_identity_review_ui.py -v
