name: Player statistics import tests

on:
  pull_request:
    paths:
      - "js/player-stats-import.js"
      - "js/player-identity-review.js"
      - "css/player-identity-review.css"
      - "tests/test_player_identity_review_ui.py"
      - "js/player-cloud.js"
      - "js/player-database.js"
      - "sw.js"
      - "js/match-center.js"
      - "js/primary-navigation.js"
      - "css/primary-navigation.css"
      - "tests/test_primary_navigation.py"
      - "css/match-center.css"
      - "tests/test_match_center.py"
      - "index.html"
      - "sw.js"
      - "tests/test_player_stats_import_ui.py"
      - "tests/test_player_statistics_import_ui.py"
      - "scripts/validate_player_stats_csv.py"
      - "scripts/preview_player_stats_import.py"
      - "scripts/reconcile_player_identity.py"
      - "scripts/update_player_database.py"
      - "tests/test_strikerapi_player_importer.py"
      - "tests/test_player_identity_reconciliation.py"
      - "tests/test_validate_player_stats_csv.py"
      - "tests/test_preview_player_stats_import.py"
      - "tests/test_player_stats_import_e2e.py"
      - "supabase/migrations/**/*.sql"
      - "supabase/tests/**/*.sql"
      - "docs/football-time-statistics-import-spec.md"
      - "docs/football-time-statistics-migration-review.md"
      - ".github/workflows/player-stats-import-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Install Python dependency
        run: python -m pip install requests
      - name: Compile scripts and tests
        run: python -m py_compile scripts/validate_player_stats_csv.py scripts/preview_player_stats_import.py scripts/reconcile_player_identity.py tests/test_validate_player_stats_csv.py tests/test_preview_player_stats_import.py tests/test_player_identity_reconciliation.py tests/test_player_identity_review_ui.py tests/test_player_stats_import_e2e.py tests/test_player_statistics_import_ui.py tests/test_strikerapi_player_importer.py tests/test_player_stats_identity_quality.py tests/test_match_center.py tests/test_primary_navigation.py
      - name: Validate browser CSV preview module
        run: |
          node --check js/player-cloud.js
          node --check js/player-database.js
          node --check js/player-stats-import.js
          node --check js/player-identity-review.js
          node --check js/match-center.js
          node --check js/primary-navigation.js
          python -m unittest tests/test_player_statistics_import_ui.py tests/test_player_identity_review_ui.py tests/test_match_center.py tests/test_primary_navigation.py -v
      - name: Check additive schema draft and pgTAP plan
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          migration = Path("supabase/migrations/20261111063000_create_player_statistics_foundation.sql").read_text()
          test_sql = Path("supabase/tests/player_statistics_schema_rls.test.sql").read_text()
          isolation_sql = Path("supabase/tests/player_statistics_two_user_import_transaction.test.sql").read_text()
          assert len(re.findall(r"^create table public\.ft_", migration, re.M | re.I)) == 7
          assert len(re.findall(r"^alter table public\.ft_.* enable row level security;", migration, re.M | re.I)) == 7
          assert not re.search(r"\b(drop table|truncate|delete from)\b", migration, re.I)
          assert "unique (user_id, id)" in migration[migration.index("create table public.ft_player_stat_source_records"):migration.index("create table public.ft_player_memberships")], "source record composite FK target must be unique"
          plan = int(re.search(r"select plan\((\d+)\)", test_sql, re.I).group(1))
          checks = len(re.findall(r"^select ok\(", test_sql, re.M | re.I))
          assert plan == checks, f"pgTAP plan {plan} does not match {checks} assertions"
          assert test_sql.strip().lower().endswith("rollback;")
          assert isolation_sql.strip().lower().endswith("rollback;")
          assert "set local role authenticated" in isolation_sql.lower()
          assert "request.jwt.claim.sub" in isolation_sql.lower()
          assert "manual_review" in isolation_sql and "history" in isolation_sql.lower()
          print(f"Schema draft: 7 additive tables; pgTAP plan: {checks}/{plan}; rollback-only two-user import test present")
          PY
      - name: Run offline player-data tests
        run: |
          python -m unittest discover -s tests -p 'test_*player_stats*.py' -v
          python -m unittest tests/test_strikerapi_player_importer.py -v
          python -m unittest discover -s tests -p 'test_player_identity_reconciliation.py' -v

  postgres-rls-transaction:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: football_time_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d football_time_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: football_time_test
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Run PostgreSQL schema, RLS, legacy transaction, and atomic RPC tests
        env:
          POSTGRES_CONTAINER_IMAGE: postgres:16
        run: |
          set -euo pipefail
          POSTGRES_CONTAINER="$(docker ps --filter "ancestor=${POSTGRES_CONTAINER_IMAGE}" --format "{{.ID}}" | head -n 1)"
          if [ -z "$POSTGRES_CONTAINER" ]; then
            echo "PostgreSQL service container was not found" >&2
            docker ps -a
            exit 1
          fi
          psql() {
            docker exec -i "$POSTGRES_CONTAINER" psql -U postgres -d football_time_test "$@"
          }
          psql -v ON_ERROR_STOP=1 <<'SQL'
          create role anon nologin;
          create role authenticated nologin;
          create role service_role nologin bypassrls;
          create schema auth;
          create table auth.users (
            id uuid primary key,
            aud text,
            role text,
            email text unique
          );
          create function auth.uid()
          returns uuid
          language sql stable
          as $$
            select nullif(current_setting('request.jwt.claim.sub', true), '')::uuid
          $$;
          grant usage on schema auth to anon, authenticated, service_role;
          grant execute on function auth.uid() to authenticated, service_role;
          SQL
          psql -v ON_ERROR_STOP=1 < supabase/migrations/20261111063000_create_player_statistics_foundation.sql
          psql -v ON_ERROR_STOP=1 < supabase/migrations/20261111064223_restrict_player_statistics_service_role_grants.sql
          # Run the pre-existing table-level lifecycle test before RPC-only writes are enforced.
          psql -v ON_ERROR_STOP=1 < supabase/tests/player_statistics_two_user_import_transaction.test.sql
          psql -v ON_ERROR_STOP=1 < supabase/migrations/20261112110000_add_atomic_player_stats_import_rpc.sql
          psql -v ON_ERROR_STOP=1 < supabase/tests/player_statistics_atomic_import_rpc.test.sql
