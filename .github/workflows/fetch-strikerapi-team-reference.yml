name: Fetch StrikerAPI team reference names (2026/27)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fetch-team-reference:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Install request dependency
        run: python -m pip install requests
      - name: Fetch five league team references (5 credits maximum)
        env:
          STRIKERAPI_API_KEY: ${{ secrets.STRIKERAPI_API_KEY }}
        run: |
          set -euo pipefail
          python scripts/strikerapi_team_reference.py --output data/staging/strikerapi-team-reference-2026-27.json
      - name: Upload reference artifact
        uses: actions/upload-artifact@v4
        with:
          name: strikerapi-team-reference-2026-27
          path: data/staging/strikerapi-team-reference-2026-27.json
          if-no-files-found: error
          retention-days: 14
