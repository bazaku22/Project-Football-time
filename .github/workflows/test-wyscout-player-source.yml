name: Test Wyscout Player Source Pilot

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "scripts/test_wyscout_player_source.py"
      - ".github/workflows/test-wyscout-player-source.yml"
      - "docs/phase-5-6-wyscout-pilot.md"

permissions:
  contents: read

jobs:
  pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate script syntax
        run: python -m py_compile scripts/test_wyscout_player_source.py
      - name: Run non-publishing source pilot
        run: python scripts/test_wyscout_player_source.py
