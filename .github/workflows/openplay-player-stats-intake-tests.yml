name: OpenPlay Player Stats Intake Tests

on:
  pull_request:
    branches: [main]
    paths:
      - "scripts/openplay_player_stats_intake.py"
      - "tests/test_openplay_player_stats_intake.py"
      - "docs/openplay-historical-player-stats-intake.md"
      - ".github/workflows/openplay-player-stats-intake.yml"
      - ".github/workflows/openplay-player-stats-intake-tests.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile and test offline transforms
        run: |
          python -m py_compile scripts/openplay_player_stats_intake.py
          python -m unittest tests/test_openplay_player_stats_intake.py -v
