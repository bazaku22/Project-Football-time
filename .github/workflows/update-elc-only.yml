name: Update ELC Only

on:
  workflow_dispatch:

permissions:
  contents: write

# Serialize with the regular database workflow so neither writer can race on main.
concurrency:
  group: football-database-update
  cancel-in-progress: false

jobs:
  update-elc:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Validate isolated ELC merge logic
        run: |
          python3 -m py_compile scripts/sync_elc_database.py scripts/validate_football_database.py
          python3 -m unittest tests/test_elc_only_sync.py

      - name: Check API secret
        env:
          API_KEY: ${{ secrets.FOOTBALL_DATA_API_KEY }}
        run: |
          if [ -z "$API_KEY" ]; then echo "::error::API secret is missing."; exit 1; fi

      - name: Fetch ELC endpoints (one attempt each; exactly three requests on success)
        env:
          API_KEY: ${{ secrets.FOOTBALL_DATA_API_KEY }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/football-data"
          for endpoint in teams matches standings; do
            output="$RUNNER_TEMP/football-data/ELC-$endpoint.json"
            status=$(curl --silent --show-error --max-time 30 --output "$output" --write-out "%{http_code}" --header "X-Auth-Token: $API_KEY" "https://api.football-data.org/v4/competitions/ELC/$endpoint") || status="000"
            echo "ELC $endpoint HTTP $status (single attempt; no retry)"
            if [ "$status" != "200" ]; then
              echo "::error::ELC $endpoint failed. No database changes were published."
              exit 1
            fi
            case "$endpoint" in
              teams) jq -e '.teams | type == "array" and length > 0 and (.[] | has("id"))' "$output" >/dev/null ;;
              matches) jq -e '.matches | type == "array"' "$output" >/dev/null ;;
              standings) jq -e '.standings | type == "array" and ([.[] | select(.type == "TOTAL" and (.table | type == "array" and length > 0))] | length == 1)' "$output" >/dev/null ;;
            esac
            sleep 10
          done

      - name: Merge ELC only, validate, and publish safely
        run: |
          set -euo pipefail
          python3 scripts/sync_elc_database.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/football-database.json
          if git diff --cached --quiet; then
            echo "ELC data is unchanged; no commit is needed."
            exit 0
          fi
          git commit -m "Update ELC football database"
          git push origin HEAD:main
