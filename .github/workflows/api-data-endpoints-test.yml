
name: Football API - Teams and Matches Test

on:
  workflow_dispatch:
  push:
    branches:
      - feature/phase-3-database-schema

permissions:
  contents: read

jobs:
  test-data-endpoints:
    runs-on: ubuntu-latest

    steps:
      - name: Check API secret
        env:
          API_KEY: ${{ secrets.FOOTBALL_DATA_API_KEY }}
        run: |
          if [ -z "$API_KEY" ]; then
            echo "::error::API secret is missing."
            exit 1
          fi
          echo "API secret is configured."

      - name: Test teams and matches for five leagues
        env:
          API_KEY: ${{ secrets.FOOTBALL_DATA_API_KEY }}
        run: |
          set -u

          codes=("PL" "PD" "BL1" "SA" "FL1")
          names=("Premier League" "La Liga" "Bundesliga" "Serie A" "Ligue 1")
          failed=0

          for i in "${!codes[@]}"; do
            code="${codes[$i]}"
            name="${names[$i]}"

            echo ""
            echo "=================================="
            echo "Testing: $name ($code)"
            echo "=================================="

            # Test teams endpoint
            teams_file="$RUNNER_TEMP/${code}-teams.json"

            teams_status=$(curl --silent --show-error \
              --output "$teams_file" \
              --write-out "%{http_code}" \
              --header "X-Auth-Token: $API_KEY" \
              "https://api.football-data.org/v4/competitions/$code/teams") || teams_status="000"

            echo "Teams HTTP status: $teams_status"

            if [ "$teams_status" = "200" ] && jq -e '.teams | type == "array"' "$teams_file" >/dev/null; then
              jq -r '"Teams returned: \(.teams | length)"' "$teams_file"
              echo "Teams result: PASSED"
            else
              echo "Teams result: FAILED"
              failed=$((failed + 1))
            fi

            # Test matches endpoint
            matches_file="$RUNNER_TEMP/${code}-matches.json"

            matches_status=$(curl --silent --show-error \
              --output "$matches_file" \
              --write-out "%{http_code}" \
              --header "X-Auth-Token: $API_KEY" \
              "https://api.football-data.org/v4/competitions/$code/matches") || matches_status="000"

            echo "Matches HTTP status: $matches_status"

            if [ "$matches_status" = "200" ] && jq -e '.matches | type == "array"' "$matches_file" >/dev/null; then
              jq -r '"Matches returned: \(.matches | length)"' "$matches_file"
              echo "Matches result: PASSED"
            else
              echo "Matches result: FAILED"
              failed=$((failed + 1))
            fi
          done

          echo ""
          echo "=================================="
          echo "Endpoint test completed."
          echo "Failed endpoint checks: $failed"
          echo "=================================="

          if [ "$failed" -gt 0 ]; then
            exit 1
          fi
