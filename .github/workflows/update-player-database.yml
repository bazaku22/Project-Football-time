name: Update Player Database
on:
  workflow_dispatch:
  schedule:
    - cron: "0 19 * * *"
  push:
    branches: [main]
    paths:
      - "scripts/update_player_database.py"
      - ".github/workflows/update-player-database.yml"
permissions:
  contents: write
concurrency:
  group: player-database-update
  cancel-in-progress: false
jobs:
  update-player-database:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - name: Check API key
        id: key
        env:
          API_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: |
          if [ -z "$API_KEY" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::API_FOOTBALL_KEY is missing; sync skipped."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Install dependency
        if: steps.key.outputs.configured == 'true'
        run: python -m pip install requests
      - name: Fetch player statistics
        if: steps.key.outputs.configured == 'true'
        env:
          API_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: python scripts/update_player_database.py
      - name: Validate JSON and unique IDs
        run: |
          python - <<'PY'
          import json
          d=json.load(open("data/player-database.json",encoding="utf-8"))
          assert d.get("schemaVersion")==1 and isinstance(d.get("records"),list)
          ids=[x["id"] for x in d["records"]]
          assert len(ids)==len(set(ids))
          print("Valid player records:",len(ids))
          PY
      - name: Commit database
        if: steps.key.outputs.configured == 'true'
        run: |
          if git diff --quiet -- data/player-database.json; then echo "No player database changes."; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/player-database.json
          git commit -m "chore: update player database"
          git pull --rebase origin main
          git push
