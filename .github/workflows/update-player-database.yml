name: Update Player Database
on:
  workflow_dispatch:
  schedule:
    - cron: "0 20 1 * *"
  push:
    branches: [main]
    paths:
      - "scripts/update_player_database.py"
      - ".github/workflows/update-player-database.yml"
permissions:
  contents: write
concurrency:
  group: player-database-update
  cancel-in-progress: false
jobs:
  update-player-database:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Check StrikerAPI key
        id: key
        env:
          STRIKERAPI_API_KEY: ${{ secrets.STRIKERAPI_API_KEY }}
        run: |
          if [ -z "$STRIKERAPI_API_KEY" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::error::STRIKERAPI_API_KEY is missing; sync cannot run."
            exit 1
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Validate Python syntax
        run: python -m py_compile scripts/update_player_database.py
      - name: Install dependency
        run: python -m pip install requests
      - name: Fetch player squads and rotating profiles
        env:
          STRIKERAPI_API_KEY: ${{ secrets.STRIKERAPI_API_KEY }}
        run: python scripts/update_player_database.py
      - name: Validate JSON and unique IDs
        run: |
          python - <<'PY'
          import json
          d=json.load(open("data/player-database.json",encoding="utf-8"))
          assert d.get("schemaVersion")==1 and isinstance(d.get("records"),list)
          ids=[x["id"] for x in d["records"]]
          assert len(ids)==len(set(ids))
          assert d.get("source",{}).get("provider")=="StrikerAPI"
          print("Valid player records:",len(ids))
          print("Profiled:",sum(x.get("profileStatus")=="profiled" for x in d["records"]))
          PY
      - name: Commit database
        run: |
          if git diff --quiet -- data/player-database.json; then echo "No player database changes."; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/player-database.json
          git commit -m "chore: update player database from StrikerAPI"
          git pull --rebase origin main
          git push
