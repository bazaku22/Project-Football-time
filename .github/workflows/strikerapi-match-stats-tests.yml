name: StrikerAPI match statistics intake tests

on:
  pull_request:
    paths:
      - "scripts/strikerapi_match_stats.py"
      - "tests/test_strikerapi_match_stats.py"
      - ".github/workflows/strikerapi-match-stats-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Compile and run offline tests
        run: |
          python -m py_compile scripts/strikerapi_match_stats.py tests/test_strikerapi_match_stats.py
          python -m unittest tests/test_strikerapi_match_stats.py -v
