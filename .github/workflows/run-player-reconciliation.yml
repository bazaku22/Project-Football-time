name: Player reconciliation from existing staging artifact

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: "Successful StrikerAPI staging workflow run ID (team reference lookup uses 5 credits)"
        required: true
        type: string
        default: "43278796571"

permissions:
  actions: read
  contents: read

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Download existing staging artifact
        uses: actions/download-artifact@v4
        with:
          name: strikerapi-current-squads-2026-27
          repository: ${{ github.repository }}
          run-id: ${{ inputs.source_run_id }}
          github-token: ${{ github.token }}
          path: data/staging/incoming

      - name: Locate and validate staging snapshot
        id: staging
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t files < <(find data/staging/incoming -type f -name 'strikerapi-current-squads-2026-27.json')
          if [ "${#files[@]}" -ne 1 ]; then
            echo "Expected exactly one staging JSON, found ${#files[@]}" >&2
            find data/staging/incoming -maxdepth 4 -type f -print >&2
            exit 1
          fi
          echo "path=${files[0]}" >> "$GITHUB_OUTPUT"

      - name: Install HTTP dependency
        run: python -m pip install requests

      - name: Fetch five-league provider team reference (5 credits)
        env:
          STRIKERAPI_API_KEY: ${{ secrets.STRIKERAPI_API_KEY }}
        run: |
          test -n "$STRIKERAPI_API_KEY" || { echo "::error::STRIKERAPI_API_KEY secret is missing."; exit 1; }
          python scripts/strikerapi_team_reference.py
          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path("data/staging/strikerapi-team-reference-2026-27.json").read_text(encoding="utf-8"))
          assert data["status"] == "reference_only"
          assert data["season"] == "2026/27"
          assert data["provider_api_calls"] == 5
          assert data["estimated_credits"] == 5
          assert len({x["league_id"] for x in data["teams"]}) == 5
          print("Validated provider team reference rows:", len(data["teams"]))
          PY

      - name: Run reconciliation with provider team reference
        run: |
          python -m py_compile scripts/player_reconciliation_pipeline.py scripts/strikerapi_team_reference.py
          python scripts/player_reconciliation_pipeline.py \
            --staging "${{ steps.staging.outputs.path }}" \
            --football-db data/football-database.json \
            --provider-teams data/staging/strikerapi-team-reference-2026-27.json \
            --out-dir data/staging/reconciliation-2026-27
          cp data/staging/strikerapi-team-reference-2026-27.json \
            data/staging/reconciliation-2026-27/provider-team-reference-2026-27.json

      - name: Upload reconciliation reports
        uses: actions/upload-artifact@v4
        with:
          name: football-time-player-reconciliation-2026-27
          path: data/staging/reconciliation-2026-27/
          if-no-files-found: error
          retention-days: 14
