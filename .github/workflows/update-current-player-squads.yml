name: Update Current Player Squads
on:
  workflow_dispatch:
  schedule:
    - cron: "0 21 * * 0"
  push:
    branches: [main]
    paths:
      - "scripts/update_player_database_api_ninjas.py"
      - ".github/workflows/update-current-player-squads.yml"
permissions:
  contents: write
concurrency:
  group: current-player-squad-update
  cancel-in-progress: false
jobs:
  update-squads:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Check API key
        env:
          API_NINJAS_API_KEY: ${{ secrets.API_NINJAS_API_KEY }}
        run: |
          if [ -z "$API_NINJAS_API_KEY" ]; then
            echo "::error::Add API_NINJAS_API_KEY in GitHub Actions Secrets before running this workflow."
            exit 1
          fi
      - name: Validate and install
        run: |
          python -m py_compile scripts/update_player_database_api_ninjas.py
          python -m pip install requests
      - name: Import current squads
        env:
          API_NINJAS_API_KEY: ${{ secrets.API_NINJAS_API_KEY }}
        run: python scripts/update_player_database_api_ninjas.py
      - name: Validate database
        run: |
          python - <<'PY'
          import json
          d=json.load(open("data/player-database.json",encoding="utf-8"))
          assert d.get("schemaVersion")==1
          assert d.get("source",{}).get("provider")=="API Ninjas"
          assert isinstance(d.get("records"),list) and d["records"]
          ids=[r["id"] for r in d["records"]]
          assert len(ids)==len(set(ids))
          print("Validated records:",len(ids))
          print("Current roster records:",sum(r.get("profileStatus")=="current_roster" for r in d["records"]))
          PY
      - name: Commit database
        run: |
          if git diff --quiet -- data/player-database.json; then echo "No player database changes."; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/player-database.json
          git commit -m "chore: refresh current player squads"
          git pull --rebase origin main
          git push
