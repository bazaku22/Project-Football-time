name: StrikerAPI current-season player leaders intake tests
on:
  pull_request:
    paths:
      - "scripts/strikerapi_player_leaders_intake.py"
      - "tests/test_strikerapi_player_leaders_intake.py"
      - ".github/workflows/fetch-strikerapi-player-leaders.yml"
      - ".github/workflows/strikerapi-player-leaders-intake-tests.yml"
      - "docs/strikerapi-current-season-player-stats-2026-27.md"
permissions:
  contents: read
jobs:
  offline-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Compile and run offline tests
        run: |
          python -m py_compile scripts/strikerapi_player_leaders_intake.py tests/test_strikerapi_player_leaders_intake.py
          python -m unittest tests/test_strikerapi_player_leaders_intake.py -v
