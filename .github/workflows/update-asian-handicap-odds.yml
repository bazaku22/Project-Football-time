name: Update Asian Handicap Reference Data

on:
  workflow_dispatch:
  pull_request:
    types: [closed]
  schedule:
    - cron: "15 23 * * *"

permissions:
  contents: write

concurrency:
  group: asian-handicap-odds-update
  cancel-in-progress: false

jobs:
  update-odds:
    if: github.ref == 'refs/heads/main' && (github.event_name != 'pull_request' || github.event.pull_request.merged == true)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Validate API secret is configured
        env:
          THE_ODDS_API_KEY: ${{ secrets.THE_ODDS_API_KEY }}
        run: |
          if [ -z "$THE_ODDS_API_KEY" ]; then
            echo "::error::THE_ODDS_API_KEY is missing."
            exit 1
          fi
          echo "The Odds API secret is configured (value hidden)."
      - name: Fetch current reference handicap lines
        env:
          THE_ODDS_API_KEY: ${{ secrets.THE_ODDS_API_KEY }}
        run: python3 scripts/fetch_asian_handicap_odds.py
      - name: Commit refreshed data only when changed
        run: |
          if git diff --quiet -- data/asian-handicap-odds.json; then
            echo "No odds data changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/asian-handicap-odds.json
          git commit -m "chore: refresh Asian Handicap reference data"
          git push origin main
