name: Update Football Research Statistics
on:
  workflow_dispatch:
  schedule:
    # Bangkok 07:15 and 19:15 (UTC 00:15 and 12:15).
    - cron: "15 0,12 * * *"
permissions:
  contents: write
concurrency:
  group: football-research-refresh
  cancel-in-progress: false
jobs:
  refresh-research:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build and validate derived research
        run: |
          python3 -m py_compile scripts/build_football_research.py
          python3 -m unittest tests/test_build_football_research.py -v
          python3 scripts/build_football_research.py
          python3 -m json.tool data/football-research-stats-2026-27.json >/dev/null
      - name: Publish changed research snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/football-research-stats-2026-27.json
          if git diff --cached --quiet; then
            echo "Research data unchanged; nothing to publish."
            exit 0
          fi
          git commit -m "Refresh derived football research statistics"
          git push origin HEAD:main
