name: UI and Handicap Validation

on:
  pull_request:
    paths:
      - "index.html"
      - "js/player-identity-review.js"
      - "js/player-team-alias-review.js"
      - "js/provisional-player-directory.js"
      - "js/player-hub.js"
      - "css/player-hub.css"
      - "tests/test_player_hub_five_phase.py"
      - "tests/test_provisional_player_directory.py"
      - "css/player-identity-review.css"
      - "js/international-handicap-model.js"
      - "js/international-handicap-workspace.js"
      - "css/international-handicap.css"
      - "data/experimental/international-r1/**"
      - "tests/test_international_handicap_model.js"
      - "tests/test_international_handicap_workspace.py"
      - "data/international-match-fixtures-r1.json"
      - "tests/test_international_match_center.py"
      - "js/asian-handicap.js"
      - "js/handicap-history.js"
      - "js/handicap-reference.js"
      - "tests/test_handicap_reference.js"
      - "css/match-center.css"
      - "css/match-center-mockup.css"
      - "match-center-mockup.html"
      - "js/match-center-mockup.js"
      - "tests/test_match_center_mockup.py"
      - "tests/test_handicap_history.js"
      - "js/primary-navigation.js"
      - "js/match-center.js"
      - "js/unified-match-center.js"
      - "js/manual-match-research.js"
      - "css/manual-match-research.css"
      - "tests/test_manual_match_research_ui.py"
      - "css/analysis-refinement.css"
      - "tests/test_asian_handicap.js"
      - "docs/phase-6-5-match-calendar-filters.md"
      - ".github/workflows/ui-handicap-validation.yml"
  push:
    branches:
      - "main"
      - "feature/match-card-intelligence-v6-2"
    paths:
      - "index.html"
      - "js/international-handicap-model.js"
      - "js/international-handicap-workspace.js"
      - "css/international-handicap.css"
      - "data/experimental/international-r1/**"
      - "tests/test_international_handicap_model.js"
      - "js/asian-handicap.js"
      - "js/primary-navigation.js"
      - "js/match-center.js"
      - "css/analysis-refinement.css"
      - "tests/test_asian_handicap.js"
      - ".github/workflows/ui-handicap-validation.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check JavaScript syntax
        run: |
          node --check js/asian-handicap.js
          node --check js/handicap-history.js
          node --check js/handicap-reference.js
          node --check js/international-handicap-model.js
          node --check js/international-handicap-workspace.js
          node --check js/primary-navigation.js
          node --check js/match-center.js
          node --check js/unified-match-center.js
          node --check js/match-center-mockup.js
          node --check js/manual-match-research.js
          python3 -m unittest tests/test_manual_match_research_ui.py -v
          node --check js/player-identity-review.js
          node --check js/player-team-alias-review.js
          node --check js/provisional-player-directory.js
          node --check js/player-hub.js
          node --check sw.js
          python - <<'PY'
          import re
          from pathlib import Path
          html = Path("index.html").read_text(encoding="utf-8")
          scripts = [s for s in re.findall(r'<script(?:\s[^>]*)?>([\s\S]*?)</script>', html, flags=re.I) if s.strip()]
          if len(scripts) != 1:
              raise SystemExit(f"Expected one non-empty inline application script, found {len(scripts)}")
          Path("/tmp/football-time-inline.js").write_text(scripts[0], encoding="utf-8")
          PY
          node --check /tmp/football-time-inline.js
      - name: Test international Handicap probability engine
        run: node tests/test_international_handicap_model.js
      - name: Test Nations League workspace isolation and data readiness
        run: python3 -m unittest tests.test_international_handicap_workspace -v
      - name: Test shared score distribution and handicap settlement
        run: node tests/test_asian_handicap.js
      - name: Test immutable Handicap history and independent metrics
        run: node tests/test_handicap_history.js
      - name: Test automatic fresh Handicap reference selection
        run: node tests/test_handicap_reference.js
      - name: Check app and service worker versions
        run: |
          grep -q 'application-version" content="6.26.1-beta.1"' index.html
          grep -q 'football-time-v83' sw.js
          grep -q 'analysis-refinement.css' sw.js
          grep -q 'international-r1/handicap-reference.json' sw.js
          ! grep -q 'rows.length>2500' index.html
