name: Update International Handicap Reference (Nations League)

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: international-nations-league-handicap-update
  cancel-in-progress: false

jobs:
  update-international-handicap:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Validate API secret is configured
        env:
          THE_ODDS_API_KEY: ${{ secrets.THE_ODDS_API_KEY }}
        run: |
          if [ -z "$THE_ODDS_API_KEY" ]; then
            echo "::error::THE_ODDS_API_KEY is missing."
            exit 1
          fi
          echo "The Odds API secret is configured (value hidden)."
      - name: Fetch isolated Nations League Handicap references (one request)
        env:
          THE_ODDS_API_KEY: ${{ secrets.THE_ODDS_API_KEY }}
        run: python3 scripts/fetch_international_handicap_odds.py
      - name: Commit isolated experimental file only
        run: |
          FILE="data/experimental/international-r1/handicap-reference.json"
          git add -- "$FILE"
          if git diff --cached --quiet -- "$FILE"; then
            echo "No international Handicap data changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: refresh isolated Nations League Handicap references"
          git push origin main
