
name: Football API - Five Leagues Test

on:
  workflow_dispatch:
  push:
    branches:
      - feature/phase-3-api-smoke-test

permissions:
  contents: read

jobs:
  test-five-leagues:
    runs-on: ubuntu-latest
    steps:
      - name: Check API secret
        env:
          API_KEY: ${{ secrets.FOOTBALL_DATA_API_KEY }}
        run: |
          if [ -z "$API_KEY" ]; then
            echo "::error::API secret is missing."
            exit 1
          fi
          echo "API secret is configured."

      - name: Test all five leagues
        env:
          API_KEY: ${{ secrets.FOOTBALL_DATA_API_KEY }}
        run: |
          set -u

          codes=("PL" "PD" "BL1" "SA" "FL1")
          names=("Premier League" "La Liga" "Bundesliga" "Serie A" "Ligue 1")
          failed=0

          for i in "${!codes[@]}"; do
            code="${codes[$i]}"
            name="${names[$i]}"
            file="$RUNNER_TEMP/$code.json"

            echo ""
            echo "Testing: $name ($code)"

            status=$(curl --silent --show-error \
              --output "$file" \
              --write-out "%{http_code}" \
              --header "X-Auth-Token: $API_KEY" \
              "https://api.football-data.org/v4/competitions/$code/standings") || status="000"

            echo "HTTP status: $status"

            if [ "$status" != "200" ]; then
              echo "Result: FAILED"
              failed=$((failed + 1))
              continue
            fi

            if ! jq -e '.competition and (.standings | type == "array")' "$file" >/dev/null; then
              echo "Result: INVALID DATA"
              failed=$((failed + 1))
              continue
            fi

            jq -r '
              "Competition: \(.competition.name)",
              "Season: \(.season.startDate // "unknown") to \(.season.endDate // "unknown")",
              "Standings groups: \(.standings | length)",
              "Teams: \([.standings[].table[]?] | length)"
            ' "$file"

            teams=$(jq '[.standings[].table[]?] | length' "$file")

            if [ "$teams" -gt 0 ]; then
              echo "Result: PASSED"
            else
              echo "Result: NO TEAM DATA"
              failed=$((failed + 1))
            fi
          done

          echo ""
          echo "Five-league test completed."
          echo "Failed leagues: $failed"

          if [ "$failed" -gt 0 ]; then
            exit 1
          fi
