name: Validate Football Time App

on:
  pull_request:
    branches: [main]
    paths:
      - "index.html"
      - "js/player-database.js"
      - "data/player-position-pilot-2026-27.json"
      - "tests/test_player_database_workspace.py"
      - "js/player-identity-review.js"
      - "css/player-identity-review.css"
      - "css/player-directory.css"
      - "tests/test_player_directory_refresh.py"
      - "tests/test_player_identity_review_ui.py"
      - "js/reep-alias-pilot.js"
      - "js/player-cloud.js"
      - "supabase/functions/reep-aliases/index.ts"
      - "docs/phase-5.6-reep-private-alias-pilot.md"
      - "data/player-database.json"
      - "data/current-player-squads-2026-27.json"
      - "scripts/validate_current_player_squads.py"
      - "tests/test_current_player_squad_validator.py"
      - "docs/player-open-data-source-assessment-2026-11.md"
      - "scripts/validate_player_intake_manifest.py"
      - "tests/test_player_intake_manifest.py"
      - "data/player-intake-manifest-2026-27.json"
      - "docs/player-intake-manifest-2026-27.md"
      - "scripts/update_player_database.py"
      - ".github/workflows/update-player-database.yml"
      - "data/football-database.json"
      - "data/test-fixtures-2026-11.json"
      - "data/national-team-research-2026-11.json"
      - "data/international-match-fixtures-r1.json"
      - "tests/test_international_match_center.py"
      - "docs/phase-6-3-international-match-center.md"
      - "js/asian-handicap.js"
      - "js/handicap-history.js"
      - "js/handicap-reference.js"
      - "tests/test_handicap_reference.js"
      - "css/match-center.css"
      - "tests/test_handicap_history.js"
      - "js/primary-navigation.js"
      - "js/match-center.js"
      - "css/analysis-refinement.css"
      - "manifest.webmanifest"
      - "tests/test_primary_navigation.py"
      - "tests/test_analysis_workspace.py"
      - "tests/test_player_statistics_import_ui.py"
      - "scripts/fetch_asian_handicap_odds.py"
      - "tests/test_asian_handicap_odds.py"
      - "scripts/fetch_international_handicap_odds.py"
      - "tests/test_international_handicap_odds.py"
      - ".github/workflows/update-international-handicap.yml"
      - "data/experimental/international-r1/fixtures.json"
      - "data/experimental/international-r1/team-aliases.json"
      - "data/experimental/international-r1/README.md"
      - ".github/workflows/update-asian-handicap-odds.yml"
      - "data/asian-handicap-odds.json"
      - "docs/phase-5.7-odds-and-legacy-archive.md"
      - "docs/roadmap-personal-simple.md"
      - "js/test-experiment-enhancements.js"
      - "tests/test_asian_handicap.js"
      - "sw.js"
      - "tests/test_match_center.py"
      - "docs/phase-6-5-match-calendar-filters.md"
      - "tests/test_football_database_sync.py"
      - "js/football-discovery.js"
      - "js/probability-metrics.js"
      - "js/test-experiment.js"
      - "tests/test_experiment_fixture_contract.py"
      - "tests/test_probability_metrics.js"
      - "scripts/build_probability_snapshots.py"
      - "scripts/phase6_league_catalog.py"
      - "tests/test_phase6_league_catalog.py"
      - "scripts/match_player_sources.py"
      - "docs/phase-5.6-multi-source-foundation.md"
      - "tests/test_probability_snapshots.py"
      - "scripts/wyscout_event_pilot.py"
      - "tests/test_wyscout_event_pilot.py"
      - "docs/phase-5.6-wyscout-parser-pilot.md"
      - ".github/workflows/validate-app.yml"
      - ".github/workflows/update-football-database.yml"
      - ".github/workflows/update-elc-only.yml"
      - "scripts/sync_elc_database.py"
      - "tests/test_elc_only_sync.py"
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Extract and validate application JavaScript
        shell: bash
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path

          html = Path("index.html").read_text(encoding="utf-8")
          scripts = [s for s in re.findall(r'<script(?:\s[^>]*)?>([\s\S]*?)</script>', html, flags=re.I) if s.strip()]
          if len(scripts) != 1:
              raise SystemExit(f"Expected one inline application script, found {len(scripts)}")
          Path("/tmp/football-time-app.js").write_text(scripts[0], encoding="utf-8")

          required = [
              'const STORAGE_KEY="pft_matches_v1"',
              'function renderTeamForm()',
              'function renderTeamProfile(',
              'function renderHomeAwayAnalysis(',
              'function renderHeadToHead(',
              'function renderLeagueAnalytics(',
              'function computeMatchProbability(',
              'function renderProbabilityAccuracy(',
              'const PROBABILITY_STORAGE_KEY=',
              'id="dbtab-form"',
              'id="dbtab-profile"',
              'id="dbtab-h2h"',
              'id="dbtab-league"',
              'id="dbtab-probability"',
              'id="dbtab-accuracy"',
              'id="dbtab-homeaway"',
              'data-db-tab="team"',
              'data-db-tab="matchStats"',
              'scoreDistribution',
              'Analysis Insight',
              'id="probabilityHistoryList"',
              'id="handicapHistoryList"',
              'pft_handicap_snapshots_v1',
              'id="archive"',
              'id="summary"',
              'id="automaticHandicapOdds"',
              'function loadAsianHandicapOdds()',
              'function renderAutomaticHandicap(',
          ]
          missing = [item for item in required if item not in html]
          if missing:
              raise SystemExit("Missing required app features: " + ", ".join(missing))
          print("Application structure and Phase 4.7 analytics feature markers are present.")
          PY
          node --check /tmp/football-time-app.js
          node --check sw.js
          python3 -m unittest tests/test_match_center.py tests/test_international_match_center.py tests/test_primary_navigation.py tests/test_analysis_workspace.py
          node --check js/football-discovery.js
          node --check js/test-experiment.js
          node --check js/asian-handicap.js
          node --check js/handicap-history.js
          node --check js/handicap-reference.js
          node tests/test_handicap_history.js
          node tests/test_handicap_reference.js
          node --check js/primary-navigation.js
          node --check js/match-center.js
          node --check js/test-experiment-enhancements.js
          python3 - <<'PY'
          from pathlib import Path

          html = Path("index.html").read_text(encoding="utf-8")
          enhancements = Path("js/test-experiment-enhancements.js").read_text(encoding="utf-8")
          home_start = html.index('<section id="home"')
          home_end = html.index('</section>', home_start)
          summary_start = html.index('<section id="summary"')
          summary_end = html.index('</section>', summary_start)
          if "testExperimentSummary" in html[home_start:home_end]:
              raise SystemExit("Experiment summary must stay off the home page.")
          if 'id="testExperimentSummary"' not in html[summary_start:summary_end]:
              raise SystemExit("Experiment summary page is missing its summary panel.")
          if "data-ah-line" in enhancements or "handicapMarkup" in enhancements:
              raise SystemExit("Manual Asian Handicap line selector must not be present in experiment fixtures.")
          for marker in ("function renderApiHandicap(", "data-api-ah-panel", 'data/asian-handicap-odds.json'):
              if marker not in enhancements:
                  raise SystemExit("Missing automatic API handicap UI marker: " + marker)
          print("Experiment summary tab and automatic API handicap UI markers are valid.")
          PY
          node --check js/player-database.js
          python3 -m unittest tests/test_player_database_workspace.py tests/test_player_directory_refresh.py -v
          python3 -m py_compile scripts/validate_current_player_squads.py
          python3 scripts/validate_current_player_squads.py
          python3 -m unittest tests/test_current_player_squad_validator.py -v
          node --input-type=module --check < js/reep-alias-pilot.js

      - name: Validate multi-source player identity matcher
        run: |
          python3 -m py_compile scripts/match_player_sources.py
          python3 scripts/match_player_sources.py --self-test

      - name: Validate Wyscout local event parser pilot
        run: |
          python3 -m py_compile scripts/wyscout_event_pilot.py
          python3 -m unittest tests/test_wyscout_event_pilot.py

      - name: Validate probability metrics and calibration
        run: |
          node --check js/probability-metrics.js
          node tests/test_probability_metrics.js

      - name: Validate isolated November experiment history
        run: python3 -m unittest tests/test_experiment_fixture_contract.py

      - name: Validate Asian Handicap settlement and odds feed
        run: |
          node tests/test_asian_handicap.js
          python3 -m py_compile scripts/fetch_asian_handicap_odds.py
          python3 -m unittest tests/test_asian_handicap_odds.py
          python3 -m py_compile scripts/fetch_international_handicap_odds.py
          python3 -m unittest tests/test_international_handicap_odds.py
          python3 - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path("data/asian-handicap-odds.json").read_text(encoding="utf-8"))
          if data.get("schemaVersion") != 1 or not isinstance(data.get("events"), list):
              raise SystemExit("Invalid Asian Handicap odds data schema")
          if "apiKey" in json.dumps(data):
              raise SystemExit("API key must never be present in odds data")
          print("Asian Handicap odds JSON is valid and contains no API key.")
          PY

      - name: Validate probability snapshot builder
        run: |
          python3 -m py_compile scripts/build_probability_snapshots.py
          python3 tests/test_probability_snapshots.py

      - name: Validate rights-cleared player intake manifest
        run: |
          python3 -m py_compile scripts/validate_player_intake_manifest.py
          python3 -m unittest tests/test_player_intake_manifest.py
          python3 scripts/validate_player_intake_manifest.py

      - name: Validate player importer and database JSON
        run: |
          python3 -m py_compile scripts/update_player_database.py
          python3 - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path("data/player-database.json").read_text(encoding="utf-8"))
          if data.get("schemaVersion") != 1 or not isinstance(data.get("records"), list):
              raise SystemExit("Invalid player database schema")
          ids=[x.get("id") for x in data["records"]]
          if len(ids) != len(set(ids)):
              raise SystemExit("Duplicate player record IDs")
          print("Player database schema and IDs are valid.")
          PY

      - name: Validate Phase 6 league catalogue and database scripts
        run: |
          python3 -m py_compile scripts/build_football_database.py scripts/validate_football_database.py scripts/phase6_league_catalog.py scripts/sync_elc_database.py
          python3 -m unittest tests/test_phase6_league_catalog.py tests/test_football_database_sync.py tests/test_elc_only_sync.py

      - name: Validate football database JSON
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(Path("data/football-database.json").read_text(encoding="utf-8"))
          required = ["leagues", "teams", "teamSeasons", "standings", "matches"]
          for key in required:
              if not isinstance(data.get(key), list):
                  raise SystemExit(f"Invalid or missing database array: {key}")
          if len(data["leagues"]) not in (5, 8):
              raise SystemExit("Expected the legacy five-league dataset or the eight-league Phase 6 dataset")
          print("Football database JSON is valid.")
          PY

      - name: Validate November test fixtures
        run: |
          python3 - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path
          from zoneinfo import ZoneInfo

          data = json.loads(Path("data/test-fixtures-2026-11.json").read_text(encoding="utf-8"))
          fixtures = data.get("fixtures")
          if not isinstance(fixtures, list) or len(fixtures) != 15:
              raise SystemExit("Expected exactly 15 November test fixtures.")

          ids = [row.get("id") for row in fixtures]
          if None in ids or len(ids) != len(set(ids)):
              raise SystemExit("Fixture IDs must be present and unique.")

          required = ("date", "kickoffUtc", "home", "away", "competition",
                      "localKickoff", "timezone", "sourceUrl", "sourceName", "status")
          bangkok = ZoneInfo("Asia/Bangkok")
          for row in fixtures:
              missing = [key for key in required if not row.get(key)]
              if missing:
                  raise SystemExit(f"Fixture {row.get('id')} is missing: {missing}")
              if not row["sourceUrl"].startswith("https://"):
                  raise SystemExit(f"Fixture {row['id']} has an invalid source URL.")
              kickoff = datetime.fromisoformat(row["kickoffUtc"].replace("Z", "+00:00"))
              if kickoff.utcoffset() != timezone.utc.utcoffset(kickoff):
                  raise SystemExit(f"Fixture {row['id']} kickoffUtc must be UTC.")
              kickoff.astimezone(bangkok)

          print("November test fixtures: 15 records, unique IDs, required fields and UTC timestamps are valid.")
          PY
