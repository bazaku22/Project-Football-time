name: Update Football Database

on:
  workflow_dispatch:
  schedule:
    - cron: "0 18 * * *"
  push:
    branches:
      - main
      - feature/phase-3-database-schema
    paths-ignore:
      - "data/football-database.json"

permissions:
  contents: write

concurrency:
  group: football-database-update
  cancel-in-progress: false

jobs:
  update-database:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Check API secret
        env:
          API_KEY: ${{ secrets.FOOTBALL_DATA_API_KEY }}
        run: |
          if [ -z "$API_KEY" ]; then
            echo "::error::API secret is missing."
            exit 1
          fi
          echo "API secret is configured."

      - name: Fetch football data
        env:
          API_KEY: ${{ secrets.FOOTBALL_DATA_API_KEY }}
        run: |
          set -euo pipefail

          mkdir -p "$RUNNER_TEMP/football-data"

          codes=("PL" "PD" "BL1" "SA" "FL1")

          fetch_endpoint() {
            local code="$1"
            local endpoint="$2"
            local output="$3"
            local headers_file
            local status
            local attempt=1
            local retry_after
            local wait_seconds

            headers_file="$(mktemp)"

            while (( attempt <= 6 )); do
              : > "$headers_file"

              status=$(curl --silent --show-error \
                --output "$output" \
                --dump-header "$headers_file" \
                --write-out "%{http_code}" \
                --header "X-Auth-Token: $API_KEY" \
                "https://api.football-data.org/v4/competitions/$code/$endpoint") || status="000"

              echo "$code $endpoint HTTP $status (attempt $attempt/6)"

              if [ "$status" = "200" ]; then
                case "$endpoint" in
                  teams)
                    jq -e '.teams | type == "array" and length > 0' "$output" >/dev/null
                    ;;
                  matches)
                    jq -e '.matches | type == "array"' "$output" >/dev/null
                    ;;
                  standings)
                    jq -e '.standings | type == "array" and length > 0' "$output" >/dev/null
                    ;;
                esac

                rm -f "$headers_file"
                sleep 10
                return 0
              fi

              if [ "$status" = "429" ] || [[ "$status" =~ ^5[0-9][0-9]$ ]] || [ "$status" = "000" ]; then
                if (( attempt == 6 )); then
                  echo "::error::$code $endpoint failed after 6 attempts."
                  rm -f "$headers_file"
                  return 1
                fi

                retry_after=$(awk 'tolower($1) == "retry-after:" {
                  gsub("\r", "", $2)
                  value = $2
                } END {
                  print value
                }' "$headers_file")

                if [[ "$retry_after" =~ ^[0-9]+$ ]]; then
                  wait_seconds="$retry_after"
                else
                  wait_seconds=$((30 * (2 ** (attempt - 1))))

                  if (( wait_seconds > 300 )); then
                    wait_seconds=300
                  fi
                fi

                echo "::warning::Request failed. Retrying in $wait_seconds seconds."
                sleep "$wait_seconds"
              else
                echo "::error::$code $endpoint returned HTTP $status."
                rm -f "$headers_file"
                return 1
              fi

              attempt=$((attempt + 1))
            done

            rm -f "$headers_file"
            return 1
          }

          for code in "${codes[@]}"; do
            echo "Fetching $code"

            for endpoint in teams matches standings; do
              output="$RUNNER_TEMP/football-data/${code}-${endpoint}.json"
              fetch_endpoint "$code" "$endpoint" "$output"
            done
          done

      - name: Build database JSON
        run: |
          python3 <<'PY'
          import json
          import os
          from datetime import datetime, timezone

          base = os.path.join(os.environ["RUNNER_TEMP"], "football-data")

          leagues = [
              {"id": "PL", "name": "Premier League", "country": "England", "providerCompetitionCode": "PL"},
              {"id": "PD", "name": "La Liga", "country": "Spain", "providerCompetitionCode": "PD"},
              {"id": "BL1", "name": "Bundesliga", "country": "Germany", "providerCompetitionCode": "BL1"},
              {"id": "SA", "name": "Serie A", "country": "Italy", "providerCompetitionCode": "SA"},
              {"id": "FL1", "name": "Ligue 1", "country": "France", "providerCompetitionCode": "FL1"}
          ]

          teams = {}
          team_seasons = []
          standings = []
          matches = []

          def read_json(code, endpoint):
              path = os.path.join(base, f"{code}-{endpoint}.json")
              with open(path, encoding="utf-8") as file:
                  return json.load(file)

          sync_time = datetime.now(timezone.utc).isoformat()

          for league in leagues:
              code = league["id"]

              team_data = read_json(code, "teams")
              match_data = read_json(code, "matches")
              standing_data = read_json(code, "standings")

              season_info = (
                  team_data.get("season")
                  or (team_data.get("competition") or {}).get("currentSeason")
                  or {}
              )

              start = season_info.get("startDate")
              end = season_info.get("endDate")

              if not start or not end:
                  raise ValueError(f"Season dates missing for {code}")

              season = start[:4] + "-" + end[:4]

              competition = team_data.get("competition") or {}
              competition_id = competition.get("id")

              for team in team_data.get("teams", []):
                  provider_id = team.get("id")

                  if provider_id is None:
                      raise ValueError(f"Team ID missing in {code}")

                  team_id = f"football-data:{provider_id}"

                  teams[team_id] = {
                      "id": team_id,
                      "provider": "football-data.org",
                      "providerTeamId": provider_id,
                      "name": team.get("name"),
                      "shortName": team.get("shortName"),
                      "tla": team.get("tla"),
                      "crest": team.get("crest"),
                      "country": (team.get("area") or {}).get("name")
                  }

                  team_seasons.append({
                      "teamId": team_id,
                      "leagueId": code,
                      "season": season,
                      "providerCompetitionId": competition_id,
                      "seasonStart": start,
                      "seasonEnd": end
                  })

              total_groups = [
                  group for group in standing_data.get("standings", [])
                  if group.get("type") == "TOTAL"
              ]

              if not total_groups:
                  raise ValueError(f"TOTAL standings missing for {code}")

              for group in total_groups:
                  for row in group.get("table", []):
                      provider_id = (row.get("team") or {}).get("id")

                      if provider_id is None:
                          raise ValueError(f"Standing team ID missing in {code}")

                      standings.append({
                          "leagueId": code,
                          "season": season,
                          "teamId": f"football-data:{provider_id}",
                          "position": row.get("position"),
                          "played": row.get("playedGames"),
                          "won": row.get("won"),
                          "draw": row.get("draw"),
                          "lost": row.get("lost"),
                          "goalsFor": row.get("goalsFor"),
                          "goalsAgainst": row.get("goalsAgainst"),
                          "goalDifference": row.get("goalDifference"),
                          "points": row.get("points"),
                          "updatedAt": sync_time
                      })

              for match in match_data.get("matches", []):
                  home = match.get("homeTeam") or {}
                  away = match.get("awayTeam") or {}
                  score = match.get("score") or {}
                  full_time = score.get("fullTime") or {}

                  status = match.get("status")

                  # Cancelled matches must never be treated as real 0-0 results.
                  if status == "CANCELLED":
                      home_score = None
                      away_score = None
                  else:
                      home_score = full_time.get("home")
                      away_score = full_time.get("away")

                  matches.append({
                      "providerMatchId": match.get("id"),
                      "leagueId": code,
                      "season": season,
                      "utcDate": match.get("utcDate"),
                      "status": status,
                      "homeTeamId": (
                          f"football-data:{home['id']}"
                          if home.get("id") is not None else None
                      ),
                      "awayTeamId": (
                          f"football-data:{away['id']}"
                          if away.get("id") is not None else None
                      ),
                      "homeTeamName": home.get("name"),
                      "awayTeamName": away.get("name"),
                      "homeScore": home_score,
                      "awayScore": away_score
                  })

              print(
                  f"{code}: "
                  f"teams={len(team_data.get('teams', []))}, "
                  f"standings={sum(len(g.get('table', [])) for g in total_groups)}, "
                  f"matches={len(match_data.get('matches', []))}"
              )

          previous_probability_snapshots = []
          previous_database_path = os.path.join("data", "football-database.json")
          if os.path.exists(previous_database_path):
              try:
                  with open(previous_database_path, encoding="utf-8") as previous_file:
                      previous_database = json.load(previous_file)
                  previous_probability_snapshots = previous_database.get("probabilitySnapshots", [])
                  if not isinstance(previous_probability_snapshots, list):
                      previous_probability_snapshots = []
              except (OSError, json.JSONDecodeError):
                  previous_probability_snapshots = []

          database = {
              "schemaVersion": "1.1.0",
              "generatedAt": sync_time,
              "source": {
                  "provider": "football-data.org",
                  "apiVersion": "v4",
                  "attribution": "Data provided by football-data.org",
                  "lastSuccessfulSync": sync_time
              },
              "leagues": leagues,
              "teams": list(teams.values()),
              "teamSeasons": team_seasons,
              "standings": standings,
              "matches": matches,
              "probabilitySnapshots": previous_probability_snapshots
          }

          os.makedirs("data", exist_ok=True)

          with open("data/football-database.json", "w", encoding="utf-8") as file:
              json.dump(database, file, ensure_ascii=False, indent=2)

          print("Database generated.")
          print("Teams:", len(teams))
          print("Team seasons:", len(team_seasons))
          print("Standings:", len(standings))
          print("Matches:", len(matches))
          PY

      - name: Build immutable pre-match probability snapshots
        run: |
          python3 scripts/build_probability_snapshots.py

      - name: Validate database JSON
        run: |
          python3 -m json.tool data/football-database.json >/dev/null

          python3 <<'PY'
          import json
          from datetime import datetime

          with open("data/football-database.json", encoding="utf-8") as file:
              db = json.load(file)

          expected = {"PL", "PD", "BL1", "SA", "FL1"}
          leagues = db["leagues"]
          teams = db["teams"]
          team_seasons = db["teamSeasons"]
          standings = db["standings"]
          matches = db["matches"]
          probability_snapshots = db.get("probabilitySnapshots", [])
          assert isinstance(probability_snapshots, list), "Invalid probability snapshots."
          snapshot_ids = [str(row["matchId"]) for row in probability_snapshots]
          assert len(snapshot_ids) == len(set(snapshot_ids)), "Duplicate probability snapshots."
          matches_by_id = {str(match["providerMatchId"]): match for match in matches}
          for snapshot in probability_snapshots:
              assert snapshot["matchId"] in matches_by_id, "Snapshot references an unknown match."
              probabilities = snapshot["probabilities"]
              assert set(probabilities) == {"home", "draw", "away"}, "Invalid 1X2 probability fields."
              assert all(isinstance(v, (int, float)) and 0 <= v <= 100 for v in probabilities.values()), "Invalid probability value."
              assert abs(sum(probabilities.values()) - 100) <= 0.11, "1X2 probabilities must total 100%."
              match_date = datetime.fromisoformat(snapshot["utcDate"].replace("Z", "+00:00"))
              created_at = datetime.fromisoformat(snapshot["createdAt"].replace("Z", "+00:00"))
              assert created_at < match_date, "Prediction snapshot must be recorded before kickoff."
              if snapshot.get("actualOutcome") is not None:
                  assert snapshot["actualOutcome"] in {"home", "draw", "away"}, "Invalid evaluated outcome."

          actual = {league["id"] for league in leagues}

          assert actual == expected, "League list is incomplete."
          assert len(leagues) == 5, "Duplicate league IDs."
          assert teams, "No teams found."
          assert standings, "No standings found."
          assert matches, "No matches found."

          team_ids = [team["id"] for team in teams]
          assert len(team_ids) == len(set(team_ids)), "Duplicate team IDs."

          known_teams = set(team_ids)

          membership_keys = [
              (item["teamId"], item["leagueId"], item["season"])
              for item in team_seasons
          ]

          assert len(membership_keys) == len(set(membership_keys)), \
              "Duplicate team season memberships."

          for item in team_seasons:
              assert item["teamId"] in known_teams, "Unknown team in teamSeasons."
              assert item["leagueId"] in expected, "Unknown league in teamSeasons."

          standing_keys = [
              (item["leagueId"], item["season"], item["teamId"])
              for item in standings
          ]

          assert len(standing_keys) == len(set(standing_keys)), \
              "Duplicate standings rows."

          for item in standings:
              assert item["leagueId"] in expected, "Unknown standings league."
              assert item["teamId"] in known_teams, "Unknown standings team."

              played = item["played"]
              won = item["won"]
              draw = item["draw"]
              lost = item["lost"]
              goals_for = item["goalsFor"]
              goals_against = item["goalsAgainst"]

              values = [played, won, draw, lost, goals_for, goals_against, item["points"]]
              assert all(isinstance(v, int) for v in values), \
                  "Invalid numeric standings value."

              assert played == won + draw + lost, "Played games mismatch."
              assert item["goalDifference"] == goals_for - goals_against, \
                  "Goal difference mismatch."
              assert item["points"] == won * 3 + draw, "Points mismatch."

          match_ids = [match["providerMatchId"] for match in matches]

          assert all(match_id is not None for match_id in match_ids), \
              "Match ID missing."
          assert len(match_ids) == len(set(match_ids)), "Duplicate match IDs."

          for match in matches:
              assert match["leagueId"] in expected, "Unknown match league."

              for field in ("homeTeamId", "awayTeamId"):
                  team_id = match[field]
                  if team_id is not None:
                      assert team_id in known_teams, \
                          f"Unknown team reference: {team_id}"

              if match["status"] == "CANCELLED":
                  assert match["homeScore"] is None, \
                      "Cancelled match has a home score."
                  assert match["awayScore"] is None, \
                      "Cancelled match has an away score."

          for league_id in expected:
              assert any(s["leagueId"] == league_id for s in standings), \
                  f"Missing standings: {league_id}"
              assert any(m["leagueId"] == league_id for m in matches), \
                  f"Missing matches: {league_id}"

          print("JSON validation: PASSED")
          print("League count:", len(leagues))
          print("Team count:", len(teams))
          print("Team season count:", len(team_seasons))
          print("Standings count:", len(standings))
          print("Match count:", len(matches))
          print("All reference and consistency checks passed.")
          PY

      - name: Commit database if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/football-database.json

          if git diff --cached --quiet; then
            echo "Database has no changes."
          else
            git commit -m "Update football database"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
