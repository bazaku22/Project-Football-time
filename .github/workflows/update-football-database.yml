name: Update Football Database

on:
  workflow_dispatch:
  schedule:
    - cron: "0 23 * * *"

permissions:
  contents: write

concurrency:
  group: football-database-update
  cancel-in-progress: false

jobs:
  update-database:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Check API secret
        env:
          API_KEY: ${{ secrets.FOOTBALL_DATA_API_KEY }}
        run: |
          if [ -z "$API_KEY" ]; then
            echo "::error::API secret is missing."
            exit 1
          fi
          echo "API secret is configured."

      - name: Test push-race recovery
        run: |
          bash -n scripts/sync_football_database.sh
          python3 -m py_compile scripts/build_football_database.py scripts/build_probability_snapshots.py scripts/validate_football_database.py scripts/phase6_league_catalog.py
          python3 -m unittest tests/test_phase6_league_catalog.py
          bash tests/test_database_push_retry.sh

      - name: Fetch football data
        env:
          API_KEY: ${{ secrets.FOOTBALL_DATA_API_KEY }}
        run: |
          set -euo pipefail

          mkdir -p "$RUNNER_TEMP/football-data"

          codes=("PL" "PD" "BL1" "SA" "FL1" "ELC")

          fetch_endpoint() {
            local code="$1"
            local endpoint="$2"
            local output="$3"
            local headers_file
            local status
            local attempt=1
            local retry_after
            local wait_seconds

            headers_file="$(mktemp)"

            while (( attempt <= 6 )); do
              : > "$headers_file"

              status=$(curl --silent --show-error \
                --output "$output" \
                --dump-header "$headers_file" \
                --write-out "%{http_code}" \
                --header "X-Auth-Token: $API_KEY" \
                "https://api.football-data.org/v4/competitions/$code/$endpoint") || status="000"

              echo "$code $endpoint HTTP $status (attempt $attempt/6)"

              if [ "$status" = "200" ]; then
                case "$endpoint" in
                  teams)
                    jq -e '.teams | type == "array" and length > 0' "$output" >/dev/null
                    ;;
                  matches)
                    jq -e '.matches | type == "array"' "$output" >/dev/null
                    ;;
                  standings)
                    jq -e '.standings | type == "array" and length > 0' "$output" >/dev/null
                    ;;
                esac

                rm -f "$headers_file"
                sleep 10
                return 0
              fi

              if [ "$status" = "429" ] || [[ "$status" =~ ^5[0-9][0-9]$ ]] || [ "$status" = "000" ]; then
                if (( attempt == 6 )); then
                  echo "::error::$code $endpoint failed after 6 attempts."
                  rm -f "$headers_file"
                  return 1
                fi

                retry_after=$(awk 'tolower($1) == "retry-after:" {
                  gsub("\r", "", $2)
                  value = $2
                } END {
                  print value
                }' "$headers_file")

                if [[ "$retry_after" =~ ^[0-9]+$ ]]; then
                  wait_seconds="$retry_after"
                else
                  wait_seconds=$((30 * (2 ** (attempt - 1))))

                  if (( wait_seconds > 300 )); then
                    wait_seconds=300
                  fi
                fi

                echo "::warning::Request failed. Retrying in $wait_seconds seconds."
                sleep "$wait_seconds"
              else
                echo "::error::$code $endpoint returned HTTP $status."
                rm -f "$headers_file"
                return 1
              fi

              attempt=$((attempt + 1))
            done

            rm -f "$headers_file"
            return 1
          }

          for code in "${codes[@]}"; do
            echo "Fetching $code"

            for endpoint in teams matches standings; do
              output="$RUNNER_TEMP/football-data/${code}-${endpoint}.json"
              fetch_endpoint "$code" "$endpoint" "$output"
            done
          done

      - name: Rebuild from latest branch and push safely
        run: |
          bash scripts/sync_football_database.sh
