
name: Update Football Database

on:
  workflow_dispatch:
  push:
    branches:
      - feature/phase-3-database-schema

permissions:
  contents: write

jobs:
  update-database:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: feature/phase-3-database-schema

      - name: Check API secret
        env:
          API_KEY: ${{ secrets.FOOTBALL_DATA_API_KEY }}
        run: |
          if [ -z "$API_KEY" ]; then
            echo "::error::API secret is missing."
            exit 1
          fi
          echo "API secret is configured."

      - name: Fetch football data
        env:
          API_KEY: ${{ secrets.FOOTBALL_DATA_API_KEY }}
        run: |
          set -euo pipefail

          mkdir -p "$RUNNER_TEMP/football-data"

          codes=("PL" "PD" "BL1" "SA" "FL1")
          failed=0

          for code in "${codes[@]}"; do
            echo "Fetching $code"

            for endpoint in teams matches standings; do
              output="$RUNNER_TEMP/football-data/${code}-${endpoint}.json"

              status=$(curl --silent --show-error \
                --output "$output" \
                --write-out "%{http_code}" \
                --header "X-Auth-Token: $API_KEY" \
                "https://api.football-data.org/v4/competitions/$code/$endpoint") || status="000"

              echo "$code $endpoint HTTP $status"

              if [ "$status" != "200" ]; then
                echo "::error::$code $endpoint request failed."
                exit 1
              fi

              case "$endpoint" in
                teams)
                  jq -e '.teams | type == "array"' "$output" >/dev/null
                  ;;
                matches)
                  jq -e '.matches | type == "array"' "$output" >/dev/null
                  ;;
                standings)
                  jq -e '.standings | type == "array"' "$output" >/dev/null
                  ;;
              esac

              sleep 7
            done
          done

      - name: Build database JSON
        run: |
          python3 <<'PY'
          import json
          import os
          from datetime import datetime, timezone

          base = os.path.join(os.environ["RUNNER_TEMP"], "football-data")

          leagues = [
              {"id": "PL", "name": "Premier League", "country": "England", "providerCompetitionCode": "PL"},
              {"id": "PD", "name": "La Liga", "country": "Spain", "providerCompetitionCode": "PD"},
              {"id": "BL1", "name": "Bundesliga", "country": "Germany", "providerCompetitionCode": "BL1"},
              {"id": "SA", "name": "Serie A", "country": "Italy", "providerCompetitionCode": "SA"},
              {"id": "FL1", "name": "Ligue 1", "country": "France", "providerCompetitionCode": "FL1"}
          ]

          teams = {}
          team_seasons = []
          standings = []
          matches = []

          def read_json(code, endpoint):
              path = os.path.join(base, f"{code}-{endpoint}.json")
              with open(path, encoding="utf-8") as file:
                  return json.load(file)

          for league in leagues:
              code = league["id"]
              team_data = read_json(code, "teams")
              match_data = read_json(code, "matches")
              standing_data = read_json(code, "standings")

              season_info = (
                  team_data.get("season")
                  or match_data.get("filters", {})
              )

              start = season_info.get("startDate")
              end = season_info.get("endDate")

              if start and end:
                  season = start[:4] + "-" + end[:4]
              else:
                  season = "unknown"

              competition = team_data.get("competition") or {}
              competition_id = competition.get("id")

              for team in team_data.get("teams", []):
                  provider_id = team.get("id")
                  if provider_id is None:
                      continue

                  team_id = f"football-data:{provider_id}"

                  teams[team_id] = {
                      "id": team_id,
                      "provider": "football-data.org",
                      "providerTeamId": provider_id,
                      "name": team.get("name"),
                      "shortName": team.get("shortName"),
                      "tla": team.get("tla"),
                      "crest": team.get("crest"),
                      "country": (team.get("area") or {}).get("name")
                  }

                  team_seasons.append({
                      "teamId": team_id,
                      "leagueId": code,
                      "season": season,
                      "providerCompetitionId": competition_id,
                      "seasonStart": start,
                      "seasonEnd": end
                  })

              for group in standing_data.get("standings", []):
    if group.get("type") != "TOTAL":
        continue

    for row in group.get("table", []):
                      provider_id = (row.get("team") or {}).get("id")
                      if provider_id is None:
                          continue

                      standings.append({
                          "leagueId": code,
                          "season": season,
                          "teamId": f"football-data:{provider_id}",
                          "position": row.get("position"),
                          "played": row.get("playedGames"),
                          "won": row.get("won"),
                          "draw": row.get("draw"),
                          "lost": row.get("lost"),
                          "goalsFor": row.get("goalsFor"),
                          "goalsAgainst": row.get("goalsAgainst"),
                          "goalDifference": row.get("goalDifference"),
                          "points": row.get("points"),
                          "updatedAt": datetime.now(timezone.utc).isoformat()
                      })

              for match in match_data.get("matches", []):
                  home = match.get("homeTeam") or {}
                  away = match.get("awayTeam") or {}
                  score = match.get("score") or {}
                  full_time = score.get("fullTime") or {}

                  matches.append({
                      "providerMatchId": match.get("id"),
                      "leagueId": code,
                      "season": season,
                      "utcDate": match.get("utcDate"),
                      "status": match.get("status"),
                      "homeTeamId": (
                          f"football-data:{home['id']}"
                          if home.get("id") is not None else None
                      ),
                      "awayTeamId": (
                          f"football-data:{away['id']}"
                          if away.get("id") is not None else None
                      ),
                      "homeTeamName": home.get("name"),
                      "awayTeamName": away.get("name"),
                      "homeScore": full_time.get("home"),
                      "awayScore": full_time.get("away")
                  })

          database = {
              "schemaVersion": "1.0.0",
              "generatedAt": datetime.now(timezone.utc).isoformat(),
              "source": {
                  "provider": "football-data.org",
                  "apiVersion": "v4",
                  "attribution": "Data provided by football-data.org",
                  "lastSuccessfulSync": datetime.now(timezone.utc).isoformat()
              },
              "leagues": leagues,
              "teams": list(teams.values()),
              "teamSeasons": team_seasons,
              "standings": standings,
              "matches": matches
          }

          os.makedirs("data", exist_ok=True)

          with open("data/football-database.json", "w", encoding="utf-8") as file:
              json.dump(database, file, ensure_ascii=False, indent=2)

          print("Database generated.")
          print("Teams:", len(teams))
          print("Team seasons:", len(team_seasons))
          print("Standings:", len(standings))
          print("Matches:", len(matches))

          if not teams or not matches:
              raise SystemExit("Database validation failed: missing teams or matches.")

          PY

      - name: Validate database JSON
        run: |
          python3 -m json.tool data/football-database.json >/dev/null

          python3 <<'PY'
          import json

          with open("data/football-database.json", encoding="utf-8") as file:
              db = json.load(file)

          expected = {"PL", "PD", "BL1", "SA", "FL1"}
          actual = {league["id"] for league in db["leagues"]}

          assert actual == expected, "League list is incomplete."
          assert db["teams"], "No teams found."
          assert db["matches"], "No matches found."

          print("JSON validation: PASSED")
          print("League count:", len(actual))
          print("Team count:", len(db["teams"]))
          print("Match count:", len(db["matches"]))
          PY

      - name: Commit database if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/football-database.json

          if git diff --cached --quiet; then
            echo "Database has no changes."
          else
            git commit -m "Update football database"
            git push origin HEAD:feature/phase-3-database-schema
          fi
